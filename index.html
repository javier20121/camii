        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#ffeef2;stop-opacity:1" />
          <stop offset="40%" style="stop-color:#ffb7c5;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#f06292;stop-opacity:1" />

          <stop offset="0%" style="stop-color:white;stop-opacity:0.5" />
          <stop offset="100%" style="stop-color:white;stop-opacity:0" />
        </radialGradient>
      </defs>

        <path d="M50,90 C45,90 10,68 10,38 C10,18 30,12 50,32 C70,12 90,18 90,38 C90,68 55,90 50,90 Z" fill="url(#volumeGrad)" />

        <!-- Reflejo de luz superior "Gloss" -->
        <path d="M22,35 C22,28 32,22 45,28" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.4" fill="none" />

            <path d="M78,25 L78,35 M73,30 L83,30" stroke="white" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="78" cy="30" r="1.5" fill="white" />
        </g>
      </g>
    </svg>
